; platformio.ini — NM-Display-28inch
[platformio]
src_dir    = src
boards_dir = boards   ; load custom board definitions from project-local boards/

[env:nm-display-28]
platform  = espressif32@6.6.0
board     = nm_display_28          ; defined in boards/nm_display_28.json
framework = arduino

; Upload / monitor
upload_speed  = 921600
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time

; Flash / PSRAM
board_build.partitions          = partitions/nm_display_28.csv
board_build.flash_size          = 16MB
board_build.flash_mode          = qio
board_build.flash_freq          = 80m
board_build.arduino.memory_type = qio_opi    ; required for Octal PSRAM

; Compiler flags
build_flags =
    -I "./src"
    -I "./src/drivers/display"   ; LVGL searches for lv_conf.h here
    ; Board identity (BSP conditional compilation)
    -D NM_DISPLAY_28=1
    ; ESP32-S3
    -D CHIP_ESP32_S3=1
    -D CONFIG_SPIRAM_CACHE_WORKAROUND=1
    ; LVGL
    -D LV_LVGL_H_INCLUDE_SIMPLE=1
    -D LV_CONF_INCLUDE_SIMPLE=1
    -D LVGL_ENABLE=1
    ; LV_COLOR_16_SWAP is defined as 0 in src/drivers/display/lv_conf.h
    ; UI layout
    -D UI_LAYOUT_320x240=1
    ; Debug level: 3 for development, 0 for release
    -D CORE_DEBUG_LEVEL=3

; SPIFFS data directory — place boot.gif and other assets here,
; then run: pio run --target uploadfs
board_build.filesystem = spiffs
data_dir               = data

; After firmware upload, automatically build + upload SPIFFS filesystem image.
; Clicking the single "Upload" button flashes both firmware and filesystem.
extra_scripts = post:scripts/upload_all.py

; Source filter — compile only the BSP for this board
build_src_filter =
    +<*>
    -<bsp/**>
    +<bsp/nm_display_28/**>

; Library dependencies
lib_deps =
    ; LVGL 8.4.x
    lvgl/lvgl@^8.4.0
    ; Camera (same API as ESP-IDF)
    https://github.com/espressif/esp32-camera
    ; Sensor library (QMI8658, PCF85063)
    lewisxhe/SensorLib@^0.2.2
    ; Power management (AXP2101)
    lewisxhe/XPowersLib@^0.2.5
    ; Button driver
    mathertel/OneButton@^2.5.0
    ; JSON
    bblanchon/ArduinoJson@^6.21.5
    ; Animated GIF decoder (boot animation)
    bitbank2/AnimatedGIF@^2.1.1

